[project]
name = "integraal-e2e"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8",
    "boto3>=1.34",
    "requests>=2.31",
    # The AWS simulator; 0.10.1 is the first release with the `runtime` Lambda executor and unencoded "/" in S3 event keys.
    "roto-aws>=0.10.1",
]

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-ra"
