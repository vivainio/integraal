[project]
name = "integraal-e2e"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8",
    "boto3>=1.34",
    "requests>=2.31",
    # Decodes what the server exports over OTLP/HTTP in the devtools suite.
    "opentelemetry-proto>=1.27",
    # The AWS simulator; 0.11.0 accepts MessageGroupId on standard queues; 0.10.1 added the `runtime` Lambda executor and unencoded "/" in S3 event keys.
    "roto-aws>=0.11.0",
]

[tool.pytest.ini_options]
testpaths = ["."]
# The developer-tools suite needs its own stack; run it with `pytest devtools`.
norecursedirs = ["devtools", ".*"]
addopts = "-ra"
