[workspace]
resolver = "2"
members = ["crates/testing", "crates/core", "crates/loader", "crates/wrappers", "crates/lambda", "crates/server", "crates/webhook", "crates/ingress", "crates/client"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio", "testing"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "metrics"] }
tracing-opentelemetry = "0.34"
mlua = { version = "0.12", features = ["luau", "vendored", "serde", "send"] }
mlua-decimal = { git = "https://github.com/vivainio/mlua-decimal", default-features = false, features = ["luau"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
aws-sdk-dynamodb = "1"
aws-sdk-sqs = "1"

integraal-loader = { path = "crates/loader" }
integraal-wrappers = { path = "crates/wrappers" }
integraal-core = { path = "crates/core" }
